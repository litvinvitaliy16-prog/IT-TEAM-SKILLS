<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT TEAM SKILLS // MATRIX CONTROL NODE</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM 18 CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <!-- Babel for JSX transformation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts & Custom Matrix Styles -->
  <link rel="stylesheet" href="css/matrix.css">
</head>
<body class="bg-[#050b06] text-[#e0ffe5] antialiased selection:bg-[#00ff41] selection:text-black">
  
  <!-- Canvas Matrix Digital Rain Background -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Subtle CRT Scanlines Filter Overlay -->
  <div class="crt-overlay"></div>

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Custom Scripts -->
  <script src="js/matrixRain.js"></script>
  <script src="js/matrixAvatar.js"></script>
  <script src="js/terminalAudio.js"></script>
  <script src="js/api.js"></script>

  <!-- React Application (Inlined for direct file:/// and HTTP compatibility) -->
  <script type="text/babel">
const { useState, useEffect, useRef } = React;

function MatrixApp() {
  const [developers, setDevelopers] = useState([]);
  const [skills, setSkills] = useState([]);
  const [loading, setLoading] = useState(true);
  const [serverStatus, setServerStatus] = useState({ online: false, latency: 0 });
  const [activeTab, setActiveTab] = useState('developers');
  const [searchTerm, setSearchTerm] = useState('');
  const [gradeFilter, setGradeFilter] = useState('ALL');
  const [isMuted, setIsMuted] = useState(false);
  const [rainSpeed, setRainSpeed] = useState(1.0);
  const [toast, setToast] = useState(null);

  const [newDevName, setNewDevName] = useState('');
  const [newDevGrade, setNewDevGrade] = useState('Junior');
  const [newDevAvatar, setNewDevAvatar] = useState(null);
  const [avatarProcessing, setAvatarProcessing] = useState(false);
  const [isSubmittingDev, setIsSubmittingDev] = useState(false);

  const [newSkillName, setNewSkillName] = useState('');
  const [isSubmittingSkill, setIsSubmittingSkill] = useState(false);
  const [devSkillSelections, setDevSkillSelections] = useState({});

  const [customAvatars, setCustomAvatars] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('matrix_dev_avatars') || '{}');
    } catch {
      return {};
    }
  });

  const matrixRainRef = useRef(null);
  const fileInputRef = useRef(null);

  const showToast = (message, type = 'info') => {
    setToast({ message, type });
    if (type === 'success') window.terminalAudio.playSuccess();
    else if (type === 'error') window.terminalAudio.playError();
    else window.terminalAudio.playClick();

    setTimeout(() => {
      setToast(null);
    }, 4000);
  };

  const handleInputType = () => {
    window.terminalAudio.playKeypress();
  };

  const handleButtonClick = () => {
    window.terminalAudio.playClick();
  };

  const toggleSound = () => {
    const muted = window.terminalAudio.toggleMute();
    setIsMuted(muted);
    showToast(muted ? 'Terminal Audio: MUTED' : 'Terminal Audio: UNMUTED', 'info');
  };

  useEffect(() => {
    if (window.MatrixRain) {
      matrixRainRef.current = new window.MatrixRain('matrix-canvas');
    }
  }, []);

  useEffect(() => {
    if (matrixRainRef.current) {
      matrixRainRef.current.setSpeed(rainSpeed);
    }
  }, [rainSpeed]);

  const fetchData = async () => {
    try {
      setLoading(true);
      const [devsRes, skillsRes, healthRes] = await Promise.all([
        window.api.getAllDevelopers().catch(err => {
          console.error("Failed to load developers:", err);
          return [];
        }),
        window.api.getAllSkills().catch(err => {
          console.error("Failed to load skills:", err);
          return [];
        }),
        window.api.checkHealth()
      ]);

      setDevelopers(Array.isArray(devsRes) ? devsRes : []);
      setSkills(Array.isArray(skillsRes) ? skillsRes : []);
      setServerStatus(healthRes);
    } catch (err) {
      showToast(`Connection Error: ${err.message}`, 'error');
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => {
    fetchData();
    const interval = setInterval(async () => {
      const health = await window.api.checkHealth();
      setServerStatus(health);
    }, 10000);
    return () => clearInterval(interval);
  }, []);

  const saveAvatar = (devId, dataUrl) => {
    const updated = { ...customAvatars, [devId]: dataUrl };
    setCustomAvatars(updated);
    try {
      localStorage.setItem('matrix_dev_avatars', JSON.stringify(updated));
    } catch (e) {
      console.warn("Storage quota exceeded", e);
    }
  };

  const handlePhotoUpload = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;

    try {
      setAvatarProcessing(true);
      window.terminalAudio.playClick();
      const filteredImage = await window.MatrixAvatar.filterImageToMatrix(file);
      setNewDevAvatar(filteredImage);
      showToast('Photo matrix filter applied!', 'success');
    } catch (err) {
      showToast('Failed to process image: ' + err.message, 'error');
    } finally {
      setAvatarProcessing(false);
    }
  };

  const handleCreateDeveloper = async (e) => {
    e.preventDefault();
    if (!newDevName.trim()) {
      showToast('Developer name cannot be empty', 'error');
      return;
    }

    try {
      setIsSubmittingDev(true);
      handleButtonClick();
      const newDev = await window.api.createDeveloper({
        dev_name: newDevName.trim(),
        grade: newDevGrade
      });

      if (newDevAvatar && newDev.id) {
        saveAvatar(newDev.id, newDevAvatar);
      }

      showToast(`Developer [${newDev.dev_name}] initialized into Matrix!`, 'success');
      setNewDevName('');
      setNewDevAvatar(null);
      if (fileInputRef.current) fileInputRef.current.value = '';
      fetchData();
    } catch (err) {
      showToast(`Create Dev Error: ${err.message}`, 'error');
    } finally {
      setIsSubmittingDev(false);
    }
  };

  const handleDeleteDeveloper = async (devId, devName) => {
    if (!confirm(`Confirm disconnect and delete developer [${devName}] from Matrix?`)) return;

    try {
      handleButtonClick();
      await window.api.deleteDeveloper(devId);
      showToast(`Developer [${devName}] terminated.`, 'info');
      fetchData();
    } catch (err) {
      showToast(`Delete Dev Error: ${err.message}`, 'error');
    }
  };

  const handleCreateSkill = async (e) => {
    e.preventDefault();
    if (!newSkillName.trim()) {
      showToast('Skill name cannot be empty', 'error');
      return;
    }

    try {
      setIsSubmittingSkill(true);
      handleButtonClick();
      const newSkill = await window.api.createSkill({
        skill_name: newSkillName.trim()
      });
      showToast(`Skill [${newSkill.skill_name}] uploaded to Matrix repository!`, 'success');
      setNewSkillName('');
      fetchData();
    } catch (err) {
      showToast(`Create Skill Error: ${err.message}`, 'error');
    } finally {
      setIsSubmittingSkill(false);
    }
  };

  const handleDeleteSkill = async (skillId, skillName) => {
    if (!confirm(`Delete skill module [${skillName}]?`)) return;

    try {
      handleButtonClick();
      await window.api.deleteSkill(skillId);
      showToast(`Skill [${skillName}] removed.`, 'info');
      fetchData();
    } catch (err) {
      showToast(`Delete Skill Error: ${err.message}`, 'error');
    }
  };

  const handleLinkSkill = async (devId) => {
    const selectedSkillId = devSkillSelections[devId];
    if (!selectedSkillId) {
      showToast('Select a skill to link', 'info');
      return;
    }

    try {
      handleButtonClick();
      await window.api.linkSkillToDeveloper(devId, Number(selectedSkillId));
      showToast('Skill attached to developer!', 'success');
      setDevSkillSelections(prev => ({ ...prev, [devId]: '' }));
      fetchData();
    } catch (err) {
      showToast(`Link Skill Error: ${err.message}`, 'error');
    }
  };

  const handleUnlinkSkill = async (devId, skillId, skillName) => {
    try {
      handleButtonClick();
      await window.api.unlinkSkillFromDeveloper(devId, skillId);
      showToast(`Skill [${skillName}] detached`, 'info');
      fetchData();
    } catch (err) {
      showToast(`Unlink Error: ${err.message}`, 'error');
    }
  };

  const filteredDevelopers = developers.filter(dev => {
    const matchesGrade = gradeFilter === 'ALL' || dev.grade?.toUpperCase() === gradeFilter;
    const matchesSearch = !searchTerm.trim() || 
      dev.dev_name?.toLowerCase().includes(searchTerm.toLowerCase()) ||
      dev.skills?.some(s => s.skill_name?.toLowerCase().includes(searchTerm.toLowerCase()));
    return matchesGrade && matchesSearch;
  });

  return (
    <div className="relative min-h-screen z-10 flex flex-col justify-between">
      {toast && (
        <div className="fixed top-6 right-6 z-50 animate-bounce">
          <div className={`px-5 py-3 rounded border text-sm font-semibold flex items-center space-x-3 shadow-2xl backdrop-blur-md ${
            toast.type === 'success' ? 'bg-black/90 border-[#00ff41] text-[#00ff41] shadow-[#00ff41]/20' :
            toast.type === 'error' ? 'bg-black/90 border-[#ff3344] text-[#ff3344] shadow-[#ff3344]/20' :
            'bg-black/90 border-[#00f3ff] text-[#00f3ff] shadow-[#00f3ff]/20'
          }`}>
            <span className="text-lg">{toast.type === 'success' ? '✓' : toast.type === 'error' ? '⚠' : 'ℹ'}</span>
            <span>{toast.message}</span>
          </div>
        </div>
      )}

      <header className="border-b border-[#00ff41]/20 bg-black/60 backdrop-blur-md sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center space-x-4">
            <div className="w-10 h-10 border-2 border-[#00ff41] flex items-center justify-center bg-black/80 shadow-[0_0_15px_rgba(0,255,65,0.3)]">
              <span className="text-[#00ff41] font-bold text-xl font-['Orbitron']">&gt;_</span>
            </div>
            <div>
              <div className="flex items-center space-x-2">
                <h1 className="font-['Orbitron'] font-black text-xl text-glow-green tracking-wider">
                  IT TEAM SKILLS
                </h1>
                <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#00ff41]/10 border border-[#00ff41]/40 text-[#00ff41]">
                  v2.0_M2M
                </span>
              </div>
              <p className="text-xs text-[#008f11]">Microservice Skills & Developers Management Hub</p>
            </div>
          </div>

          <div className="flex items-center space-x-3 text-xs">
            <div className="flex items-center space-x-2 px-3 py-1.5 rounded bg-black/80 border border-[#00ff41]/30">
              <span className={`w-2.5 h-2.5 rounded-full ${serverStatus.online ? 'bg-[#00ff41] pulse-dot' : 'bg-[#ff3344]'}`} />
              <span className={serverStatus.online ? 'text-[#00ff41]' : 'text-[#ff3344]'}>
                {serverStatus.online ? `FASTAPI ONLINE (${serverStatus.latency}ms)` : 'BACKEND OFFLINE (PORT 8080)'}
              </span>
            </div>

            <button 
              onClick={toggleSound}
              className="px-3 py-1.5 rounded cyber-panel flex items-center space-x-1.5 text-xs text-[#00ff41] hover:border-[#00ff41]"
              title="Toggle Terminal Sounds"
            >
              <span>{isMuted ? '🔇 SOUND OFF' : '🔊 SOUND ON'}</span>
            </button>

            <button 
              onClick={() => { handleButtonClick(); fetchData(); }}
              className="px-3 py-1.5 rounded cyber-btn text-xs"
              title="Refresh Data"
            >
              ⟳ SYNC
            </button>
          </div>
        </div>

        <div className="max-w-7xl mx-auto px-4 flex space-x-4 border-t border-[#00ff41]/10">
          <button
            onClick={() => { handleButtonClick(); setActiveTab('developers'); }}
            className={`py-2.5 px-4 font-semibold text-sm transition-all border-b-2 ${
              activeTab === 'developers' 
                ? 'border-[#00ff41] text-[#00ff41] text-glow-green bg-[#00ff41]/5' 
                : 'border-transparent text-[#008f11] hover:text-[#00ff41]'
            }`}
          >
            [ DEVELOPERS MATRIX ({developers.length}) ]
          </button>
          <button
            onClick={() => { handleButtonClick(); setActiveTab('skills'); }}
            className={`py-2.5 px-4 font-semibold text-sm transition-all border-b-2 ${
              activeTab === 'skills' 
                ? 'border-[#00ff41] text-[#00ff41] text-glow-green bg-[#00ff41]/5' 
                : 'border-transparent text-[#008f11] hover:text-[#00ff41]'
            }`}
          >
            [ SKILLS REPOSITORY ({skills.length}) ]
          </button>
        </div>
      </header>

      <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        {activeTab === 'developers' && (
          <div className="space-y-8">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="cyber-panel p-5 rounded-lg lg:col-span-1">
                <div className="cyber-corner-tl" />
                <div className="cyber-corner-tr" />
                <div className="cyber-corner-bl" />
                <div className="cyber-corner-br" />

                <h2 className="text-sm font-bold font-['Orbitron'] text-glow-green mb-4 flex items-center justify-between">
                  <span>+ INITIALIZE DEVELOPER</span>
                  <span className="text-[10px] text-[#008f11]">POST /api/dev/create</span>
                </h2>

                <form onSubmit={handleCreateDeveloper} className="space-y-4">
                  <div>
                    <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                      Developer Name
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. Thomas Anderson"
                      value={newDevName}
                      onChange={(e) => { setNewDevName(e.target.value); handleInputType(); }}
                      className="w-full px-3 py-2 text-sm rounded cyber-input"
                      required
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                      Grade Level
                    </label>
                    <select
                      value={newDevGrade}
                      onChange={(e) => { setNewDevGrade(e.target.value); handleButtonClick(); }}
                      className="w-full px-3 py-2 text-sm rounded cyber-input"
                    >
                      <option value="Junior">Junior</option>
                      <option value="Middle">Middle</option>
                      <option value="Senior">Senior</option>
                      <option value="Lead">Lead</option>
                      <option value="Architect">Architect</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                      Avatar Matrix Filter (Photo Upload)
                    </label>
                    <div className="flex items-center space-x-3">
                      <input
                        type="file"
                        accept="image/*"
                        ref={fileInputRef}
                        onChange={handlePhotoUpload}
                        className="text-xs text-[#00ff41] file:mr-3 file:py-1 file:px-3 file:rounded file:border file:border-[#00ff41]/50 file:text-xs file:bg-black file:text-[#00ff41] file:cursor-pointer hover:file:bg-[#00ff41] hover:file:text-black cursor-pointer"
                      />
                      {newDevAvatar && (
                        <div className="w-10 h-10 border border-[#00ff41] rounded overflow-hidden flex-shrink-0">
                          <img src={newDevAvatar} alt="Preview" className="w-full h-full object-cover" />
                        </div>
                      )}
                    </div>
                    {avatarProcessing && (
                      <p className="text-[11px] text-[#00f3ff] mt-1 animate-pulse">
                        ⚙ Applying Matrix phosphor filter...
                      </p>
                    )}
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmittingDev}
                    className="w-full py-2.5 px-4 rounded cyber-btn text-xs tracking-wider uppercase font-bold"
                  >
                    {isSubmittingDev ? 'INITIALIZING...' : 'INITIALIZE DEVELOPER'}
                  </button>
                </form>
              </div>

              <div className="cyber-panel p-5 rounded-lg lg:col-span-2 flex flex-col justify-between">
                <div className="cyber-corner-tl" />
                <div className="cyber-corner-tr" />
                <div className="cyber-corner-bl" />
                <div className="cyber-corner-br" />

                <div>
                  <h2 className="text-sm font-bold font-['Orbitron'] text-glow-green mb-4 flex items-center justify-between">
                    <span>OPERATORS SEARCH & FILTER</span>
                    <span className="text-[10px] text-[#008f11]">{filteredDevelopers.length} MATCHES</span>
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                      <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                        Search By Name or Skill
                      </label>
                      <input
                        type="text"
                        placeholder="Type to search..."
                        value={searchTerm}
                        onChange={(e) => { setSearchTerm(e.target.value); handleInputType(); }}
                        className="w-full px-3 py-2 text-sm rounded cyber-input"
                      />
                    </div>

                    <div>
                      <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                        Filter by Grade
                      </label>
                      <select
                        value={gradeFilter}
                        onChange={(e) => { setGradeFilter(e.target.value); handleButtonClick(); }}
                        className="w-full px-3 py-2 text-sm rounded cyber-input"
                      >
                        <option value="ALL">All Grades</option>
                        <option value="JUNIOR">Junior</option>
                        <option value="MIDDLE">Middle</option>
                        <option value="SENIOR">Senior</option>
                        <option value="LEAD">Lead</option>
                        <option value="ARCHITECT">Architect</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2 pt-3 border-t border-[#00ff41]/20 text-center">
                  <div className="p-2 bg-black/40 rounded border border-[#00ff41]/10">
                    <div className="text-lg font-bold text-glow-green font-['Orbitron']">{developers.length}</div>
                    <div className="text-[10px] text-[#008f11]">TOTAL DEVS</div>
                  </div>
                  <div className="p-2 bg-black/40 rounded border border-[#00ff41]/10">
                    <div className="text-lg font-bold text-glow-cyan font-['Orbitron']">{skills.length}</div>
                    <div className="text-[10px] text-[#008f11]">SKILLS POOL</div>
                  </div>
                  <div className="p-2 bg-black/40 rounded border border-[#00ff41]/10">
                    <div className="text-lg font-bold text-glow-amber font-['Orbitron']">
                      {developers.reduce((acc, dev) => acc + (dev.skills?.length || 0), 0)}
                    </div>
                    <div className="text-[10px] text-[#008f11]">M2M LINKS</div>
                  </div>
                </div>
              </div>
            </div>

            <div>
              <div className="flex items-center justify-between mb-4">
                <h3 className="text-xs uppercase tracking-widest text-[#00ff41] font-bold font-['Orbitron']">
                  // REGISTERED DEVELOPERS MATRIX
                </h3>
              </div>

              {loading ? (
                <div className="text-center py-16 cyber-panel rounded-lg">
                  <div className="text-[#00ff41] text-lg font-bold animate-pulse font-['Orbitron']">
                    CONNECTING TO FASTAPI CORE...
                  </div>
                </div>
              ) : filteredDevelopers.length === 0 ? (
                <div className="text-center py-16 cyber-panel rounded-lg">
                  <p className="text-gray-400 text-sm mb-2">No developers found in Matrix node.</p>
                  <p className="text-xs text-[#008f11]">Initialize a new developer using the form above.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredDevelopers.map(dev => {
                    const avatarUrl = customAvatars[dev.id] || window.MatrixAvatar.generateDefaultAvatar(dev.dev_name, dev.grade);
                    const gradeClass = `grade-${dev.grade?.toLowerCase()}`;
                    const devSkills = dev.skills || [];
                    const availableSkills = skills.filter(
                      s => !devSkills.some(ds => ds.id === s.id || ds.skill_name === s.skill_name)
                    );

                    return (
                      <div key={dev.id} className="cyber-panel p-5 rounded-lg flex flex-col justify-between">
                        <div className="cyber-corner-tl" />
                        <div className="cyber-corner-tr" />
                        <div className="cyber-corner-bl" />
                        <div className="cyber-corner-br" />

                        <div>
                          <div className="flex items-start justify-between gap-3 mb-4">
                            <div className="flex items-center space-x-3">
                              <img
                                src={avatarUrl}
                                alt={dev.dev_name}
                                className="w-14 h-14 rounded border border-[#00ff41]/50 object-cover shadow-[0_0_10px_rgba(0,255,65,0.2)]"
                              />
                              <div>
                                <div className="text-xs text-[#008f11] font-mono">ID: #{dev.id}</div>
                                <h4 className="font-bold text-sm text-[#e0ffe5] leading-tight mb-1">
                                  {dev.dev_name}
                                </h4>
                                <span className={`grade-badge ${gradeClass}`}>
                                  {dev.grade}
                                </span>
                              </div>
                            </div>

                            <button
                              onClick={() => handleDeleteDeveloper(dev.id, dev.dev_name)}
                              className="text-xs text-[#ff3344] hover:text-white p-1 rounded hover:bg-[#ff3344] transition-all"
                              title="Delete Developer"
                            >
                              ✕
                            </button>
                          </div>

                          <div className="mb-4">
                            <div className="text-[11px] uppercase tracking-wider text-[#008f11] mb-2 font-semibold">
                              Skills Stack ({devSkills.length}):
                            </div>
                            {devSkills.length === 0 ? (
                              <p className="text-xs text-gray-500 italic">No skills attached yet</p>
                            ) : (
                              <div className="flex flex-wrap gap-1.5">
                                {devSkills.map(s => (
                                  <span
                                    key={s.id || s.skill_name}
                                    className="inline-flex items-center px-2 py-0.5 rounded text-xs bg-[#00ff41]/10 border border-[#00ff41]/30 text-[#00ff41]"
                                  >
                                    <span>{s.skill_name}</span>
                                    <button
                                      onClick={() => handleUnlinkSkill(dev.id, s.id, s.skill_name)}
                                      className="ml-1.5 text-[#ff3344] hover:text-white hover:bg-[#ff3344] rounded-full w-3.5 h-3.5 inline-flex items-center justify-center text-[10px]"
                                      title="Unlink Skill"
                                    >
                                      ×
                                    </button>
                                  </span>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>

                        <div className="pt-3 border-t border-[#00ff41]/15">
                          <div className="flex items-center space-x-2">
                            <select
                              value={devSkillSelections[dev.id] || ''}
                              onChange={(e) => setDevSkillSelections(prev => ({ ...prev, [dev.id]: e.target.value }))}
                              className="flex-1 px-2 py-1 text-xs rounded cyber-input"
                              disabled={availableSkills.length === 0}
                            >
                              <option value="">
                                {availableSkills.length === 0 ? 'No more skills to add' : '+ Select skill to link...'}
                              </option>
                              {availableSkills.map(s => (
                                <option key={s.id} value={s.id}>
                                  {s.skill_name}
                                </option>
                              ))}
                            </select>
                            <button
                              onClick={() => handleLinkSkill(dev.id)}
                              disabled={!devSkillSelections[dev.id]}
                              className="px-2.5 py-1 text-xs rounded cyber-btn font-bold"
                              title="Attach Skill"
                            >
                              LINK
                            </button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        )}

        {activeTab === 'skills' && (
          <div className="space-y-8">
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="cyber-panel p-5 rounded-lg lg:col-span-1">
                <div className="cyber-corner-tl" />
                <div className="cyber-corner-tr" />
                <div className="cyber-corner-bl" />
                <div className="cyber-corner-br" />

                <h2 className="text-sm font-bold font-['Orbitron'] text-glow-green mb-4 flex items-center justify-between">
                  <span>+ UPLOAD NEW SKILL</span>
                  <span className="text-[10px] text-[#008f11]">POST /api/skills/create</span>
                </h2>

                <form onSubmit={handleCreateSkill} className="space-y-4">
                  <div>
                    <label className="block text-xs text-[#008f11] mb-1 uppercase font-semibold">
                      Skill Name / Technology
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. FastAPI, PostgreSQL, Docker"
                      value={newSkillName}
                      onChange={(e) => { setNewSkillName(e.target.value); handleInputType(); }}
                      className="w-full px-3 py-2 text-sm rounded cyber-input"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={isSubmittingSkill}
                    className="w-full py-2.5 px-4 rounded cyber-btn text-xs tracking-wider uppercase font-bold"
                  >
                    {isSubmittingSkill ? 'UPLOADING...' : 'UPLOAD SKILL MODULE'}
                  </button>
                </form>
              </div>

              <div className="cyber-panel p-5 rounded-lg lg:col-span-2">
                <div className="cyber-corner-tl" />
                <div className="cyber-corner-tr" />
                <div className="cyber-corner-bl" />
                <div className="cyber-corner-br" />

                <h2 className="text-sm font-bold font-['Orbitron'] text-glow-green mb-4 flex items-center justify-between">
                  <span>GLOBAL SKILLS REPOSITORY</span>
                  <span className="text-[10px] text-[#008f11]">{skills.length} MODULES</span>
                </h2>

                {skills.length === 0 ? (
                  <div className="text-center py-12 text-gray-400 text-xs">
                    No skills registered yet. Create your first skill module.
                  </div>
                ) : (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    {skills.map(s => {
                      const linkedDevs = developers.filter(dev => 
                        dev.skills?.some(ds => ds.id === s.id || ds.skill_name === s.skill_name)
                      );

                      return (
                        <div
                          key={s.id}
                          className="p-3 rounded bg-black/60 border border-[#00ff41]/20 hover:border-[#00ff41] transition-all flex items-center justify-between"
                        >
                          <div>
                            <div className="font-bold text-sm text-[#e0ffe5]">{s.skill_name}</div>
                            <div className="text-[10px] text-[#008f11]">
                              Linked to {linkedDevs.length} developer{linkedDevs.length === 1 ? '' : 's'}
                            </div>
                          </div>
                          <button
                            onClick={() => handleDeleteSkill(s.id, s.skill_name)}
                            className="text-xs text-[#ff3344] hover:text-white p-1 rounded hover:bg-[#ff3344] transition-all"
                            title="Delete Skill"
                          >
                            ✕
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        )}
      </main>

      <footer className="border-t border-[#00ff41]/20 bg-black/80 backdrop-blur-md py-6 px-4 text-center mt-12 relative">
        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
          <div className="text-xs text-[#008f11]">
            PROTOCOL // FASTAPI + SQLALCHEMY ASYNC + PYDANTIC 2.0
          </div>
          <div className="watermark-testman text-2xl">
            TESTMAN
          </div>
          <div className="text-xs text-[#008f11]">
            STATUS // SECURE ACCESS GRANTED
          </div>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<MatrixApp />);
  </script>
</body>
</html>
