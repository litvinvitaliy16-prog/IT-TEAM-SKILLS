services:
  backend:
    build: .
    container_name: it_team_skills_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # SQLite database lives in a persistent Docker volume (not in the repo)
      - DB_PATH=/data/it_team_skills.db
    volumes:
      - it_team_skills_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/skills/all')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  it_team_skills_data:
